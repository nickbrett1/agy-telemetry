[project]
name = "agy-telemetry"
version = "0.1.0"
description = "A lightweight telemetry integration for the Google Antigravity (agy) CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=7.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
python_files = "*.test.py"
